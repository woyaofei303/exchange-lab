name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify Go and Compose project
        run: make check
      - name: Build API image
        run: docker compose build api
      - name: Start dependency services
        run: docker compose up -d --wait --wait-timeout 120 postgres redis nats
      - name: Run dependency integration tests
        run: timeout 2m make integration
      - name: Stop Compose services
        if: always()
        run: docker compose down
