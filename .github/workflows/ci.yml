name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify Go and Compose project
        run: make check
      - name: Build application image
        run: docker compose build api
      - name: Start dependency services
        run: docker compose up -d --wait --wait-timeout 120 postgres redis nats
      - name: Run dependency integration tests
        run: timeout 2m make integration
      - name: Run bounded fuzz smoke
        run: make fuzz-smoke
      - name: Start full contract stack
        run: docker compose up -d --wait --wait-timeout 180
      - name: Run REST and worker smoke
        run: make smoke
      - name: Run derivative contract flow
        run: make derivatives-check
      - name: Run browser E2E
        run: make web-e2e
      - name: Verify backup restoration
        run: make backup-restore-check
      - name: Verify production security baseline
        run: make security-check
      - name: Scan application image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: exchange-lab:local
          format: table
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Stop Compose services
        if: always()
        run: docker compose down

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web assets
        run: npm ci --prefix web && npm run build --prefix web
      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable image
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          provenance: mode=max
          sbom: true
