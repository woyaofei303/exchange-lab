name: exchange-lab

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-exchange}
      POSTGRES_USER: ${POSTGRES_USER:-exchange}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-exchange_dev_only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 20
    networks: [exchange]

  redis:
    image: redis:8.4.1-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
    networks: [exchange]

  nats:
    image: nats:2.12.4-alpine
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider 'http://127.0.0.1:8222/healthz?js-enabled-only=true'"]
      interval: 2s
      timeout: 2s
      retries: 20
    networks: [exchange]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_HTTP_ADDR: :8080
      POSTGRES_DSN: postgres://${POSTGRES_USER:-exchange}:${POSTGRES_PASSWORD:-exchange_dev_only}@postgres:5432/${POSTGRES_DB:-exchange}?sslmode=disable
      REDIS_ADDR: redis:6379
      NATS_URL: nats://nats:4222
      DEPENDENCY_TIMEOUT: 1s
      SHUTDOWN_TIMEOUT: 10s
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      nats: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/readyz"]
      interval: 2s
      timeout: 2s
      retries: 20
    networks: [exchange]

networks:
  exchange:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  nats_data:
