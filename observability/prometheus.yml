global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: exchange-api
    static_configs: [{targets: [api:8080]}]
  - job_name: exchange-workers
    static_configs: [{targets: [price-worker:8093, risk-worker:8094, funding-worker:8095]}]
