      properties:
        data: {type: array, items: {$ref: '#/components/schemas/Position'}}
    RiskSnapshot:
      type: object
      additionalProperties: false
      required: [symbol, mode, leverage, position_size, entry_price, mark_price, position_margin, order_margin, wallet_available, unrealized_pnl, margin_balance, maintenance_margin, margin_ratio_bps, liquidation_distance_bps, risk_version, fresh, as_of]
      properties:
        symbol: {type: string, pattern: '^[A-Z0-9]{4,24}-PERP$'}
        mode: {type: string, enum: [isolated, cross]}
        leverage: {type: integer, format: int64, minimum: 1, maximum: 125}
        position_size: {$ref: '#/components/schemas/SignedDecimal'}
        entry_price: {$ref: '#/components/schemas/NonNegativeDecimal'}
        mark_price: {$ref: '#/components/schemas/NonNegativeDecimal'}
        position_margin: {$ref: '#/components/schemas/NonNegativeDecimal'}
        order_margin: {$ref: '#/components/schemas/NonNegativeDecimal'}
        wallet_available: {$ref: '#/components/schemas/NonNegativeDecimal'}
        unrealized_pnl: {$ref: '#/components/schemas/SignedDecimal'}
        margin_balance: {$ref: '#/components/schemas/SignedDecimal'}
        maintenance_margin: {$ref: '#/components/schemas/NonNegativeDecimal'}
        margin_ratio_bps: {type: integer, format: int64, minimum: 0}
        liquidation_distance_bps: {type: integer, format: int64, minimum: 0}
        risk_version: {type: integer, format: int64, minimum: 1}
        fresh: {type: boolean}
        as_of: {type: string, format: date-time}
    RiskResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/RiskSnapshot'}
    SetLeverageRequest:
      type: object
      additionalProperties: false
      required: [symbol, leverage]
      properties:
        symbol: {type: string, pattern: '^[A-Z0-9]{4,24}-PERP$'}
        leverage: {type: integer, format: int64, minimum: 1, maximum: 125}
    SetMarginModeRequest:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode: {type: string, enum: [isolated, cross]}
    AdjustMarginRequest:
      type: object
      additionalProperties: false
      required: [symbol, amount]
      properties:
        symbol: {type: string, pattern: '^[A-Z0-9]{4,24}-PERP$'}
        amount: {$ref: '#/components/schemas/SignedDecimal'}
    CreateConditionalRequest:
      type: object
      additionalProperties: false
      required: [symbol, type, trigger_source, trigger_direction, trigger_price, quantity]
      properties:
        symbol: {type: string, pattern: '^[A-Z0-9]{4,24}-PERP$'}
        type: {type: string, enum: [take_profit, stop_loss]}
        trigger_source: {type: string, enum: [mark, last]}
        trigger_direction: {type: string, enum: [gte, lte]}
        trigger_price: {$ref: '#/components/schemas/PositiveDecimal'}
        quantity: {$ref: '#/components/schemas/PositiveDecimal'}
    GenericDataResponse:
      type: object
      required: [data]
      properties:
        data: {}
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code:
              type: string
              enum:
                - invalid_request
                - method_not_allowed
                - not_found
                - request_canceled
                - internal_error
                - request_timeout
                - unauthenticated
                - forbidden
                - conflict
                - idempotency_conflict
                - insufficient_balance
                - rate_limited
                - security_state_unavailable
                - price_unavailable
                - ai_unavailable
            message:
              type: string
            request_id:
              type: string
              pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
    PositiveDecimal:
      type: string
      pattern: '^(0*[1-9][0-9]*)(\.[0-9]+)?$|^0+\.0*[1-9][0-9]*$'
    NonNegativeDecimal:
      type: string
      pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
    SignedDecimal:
      type: string
      pattern: '^-?(0|[1-9][0-9]*)(\.[0-9]+)?$'
